services:
  db:
    image: postgres:16-alpine
    container_name: chatbot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_bot_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: chatbot_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Servicio de un solo uso: aplica las migraciones y siembra los datos iniciales
  # antes de arrancar la app. Se construye con el stage `builder` porque necesita
  # la CLI de Prisma y tsx (devDependencies).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: chatbot_migrate
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatbot_user}:${POSTGRES_PASSWORD:-secure_bot_password_123}@db:5432/${POSTGRES_DB:-chatbot_db}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatbot_user}:${POSTGRES_PASSWORD:-secure_bot_password_123}@db:5432/${POSTGRES_DB:-chatbot_db}?schema=public
      OLLAMA_BASE_URL: http://ollama:11434

volumes:
  postgres_data:
  ollama_data:
